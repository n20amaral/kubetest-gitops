apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: expenses
  namespace: expenses
  annotations:
    # Staging cert observed issuing 2026-09-01 11:43 UTC — switched to prod.
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - expenses.thatsnotfor.me
      secretName: expenses-tls
  rules:
    - host: expenses.thatsnotfor.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: expenses
                port:
                  name: http
