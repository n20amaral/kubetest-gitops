apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: expenses
  namespace: expenses
  annotations:
    # Staging first — flip to letsencrypt-prod once a staging cert is observed issuing.
    cert-manager.io/cluster-issuer: letsencrypt-staging
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - expenses.thatsnotfor.me
      secretName: expenses-tls
  rules:
    - host: expenses.thatsnotfor.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: expenses
                port:
                  name: http
