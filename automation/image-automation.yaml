apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: expenses-app
  namespace: flux-system
spec:
  image: ghcr.io/n20amaral/expenses-app
  interval: 5m
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: expenses-app
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: expenses-app
  filterTags:
    # main-<sha7>-<unix-ts>; sort by the trailing timestamp
    pattern: '^main-[a-f0-9]+-(?P<ts>[0-9]+)$'
    extract: '$ts'
  policy:
    numerical:
      order: asc
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
  name: expenses-app
  namespace: flux-system
spec:
  interval: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  git:
    checkout:
      ref:
        branch: main
    commit:
      author:
        name: fluxcdbot
        email: fluxcdbot@users.noreply.github.com
      messageTemplate: |
        chore(expenses): bump image to {{range .Updated.Images}}{{println .}}{{end}}
    push:
      branch: main
  update:
    path: ./apps/expenses
    strategy: Setters
