apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  dependsOn:
    - name: db
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  path: ./apps/expenses
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
