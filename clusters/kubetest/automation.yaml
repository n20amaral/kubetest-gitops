apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: automation
  namespace: flux-system
spec:
  dependsOn:
    - name: apps
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  path: ./automation
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
