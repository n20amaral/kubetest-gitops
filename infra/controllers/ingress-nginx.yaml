apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: ingress-nginx
  namespace: flux-system
spec:
  interval: 24h
  url: https://kubernetes.github.io/ingress-nginx
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ingress-nginx
  namespace: ingress-nginx
spec:
  interval: 1h
  chart:
    spec:
      chart: ingress-nginx
      version: "4.15.1"
      sourceRef:
        kind: HelmRepository
        name: ingress-nginx
        namespace: flux-system
  install:
    crds: Create
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    controller:
      # Cilium here supports neither hostPort nor kubeProxyReplacement, so the
      # controller runs as a DaemonSet directly on the host network. cp1 is
      # tainted, so it lands only on w1 (4.223.137.42).
      kind: DaemonSet
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      hostPort:
        enabled: false
      publishService:
        enabled: false
      service:
        type: ClusterIP
      ingressClassResource:
        default: true
      watchIngressWithoutClass: true
      admissionWebhooks:
        enabled: true
