apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespaces.yaml
  - local-path-provisioner.yaml
  - cloudnative-pg.yaml
  - ingress-nginx.yaml
  - cert-manager.yaml

patches:
  # The cluster has no StorageClass at all — make local-path the default.
  - target:
      kind: StorageClass
      name: local-path
    patch: |
      - op: add
        path: /metadata/annotations
        value:
          storageclass.kubernetes.io/is-default-class: "true"
